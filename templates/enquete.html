<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dziennik programisty</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <style>
        body {
            background-image: url("static/img/CS2.png");
            
            background-size: cover;

            background-position: center;
            
            background-repeat: no-repeat;
            
            background-attachment: fixed;
            
        }
        .enquete {
            text-align: center;
            
            justify-content: space-between;

            padding: 20px 2%;

            margin-bottom: 30px;
        }
    </style>
    <div2 style="text-align: center;">
        <h1>Enquete</h1>
    </div2>
    
    <header class="header">
        <ul class="main-list">

        </ul>
      </header>
      <main class="enquete">
        {% block content %}
        <main class="enquete">
    <form action="{{ url_for('enquete') }}" method="post">
        <input class="form__input" type="text" name="id" placeholder="Type in your nickname" required>
        <input class="form__input" type="text" name="text" placeholder="Type in your favourite lineups!" required>
        <button type="submit" class="form__button">Confirm</button>
    </form>
</main>
        {% endblock %}
      </main>
      
<table border="2" style="margin: auto;">
    <tr>
        <th>Nickname</th>
        <th>Lineup</th>
    </tr>

    {% for entry in entries %}
    <tr>
        <td>{{ entry.nickname }}</td>
        <td>{{ entry.text }}</td>
    </tr>
    {% endfor %}
</table>
    <h2><a href="/lineups">Powrót</a></h2>
</body>
</html>
